name: Dispatch 140 validation (GitHub-hosted)

# Secret-free, validation-only lane for the local/continuous-autorouting-140
# branch: canonical turn-boundary, replay, gateway and resume checks.
# Publishes nothing, deploys nothing, bills nothing and reads no credentials.
# The upstream Blacksmith lanes in ci.yaml are intentionally left untouched.
# The AutoRouter plugin suite is NOT run here (see the note at the bottom).

on:
  push:
    branches:
      - local/continuous-autorouting-140
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: continuous-autorouting-140-${{ github.ref }}
  cancel-in-progress: true

jobs:
  turn-boundary:
    name: Turn-boundary, replay and gateway tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TZ: UTC
      LANG: C.UTF-8
      PYTHONHASHSEED: '0'
      CI: 'true'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.14'
          python-version: '3.14'

      - name: Sync dependencies
        run: uv sync --frozen --group dev --extra acp

      - name: Focused tests via canonical Hermes runner
        run: |
          set -euo pipefail
          # HERMES_PYTHON pins the frozen venv for run_tests.sh (hermetic env
          # filtering, independent file workers and timeout policy).
          files=(
            tests/agent/test_no_replay_after_commit.py
            tests/agent/test_truncation_no_replay_after_commit.py
            tests/agent/test_replay_boundaries.py
            tests/gateway/test_autorouter_turn.py
            tests/tui_gateway/test_autorouter_managed_resume.py
            tests/tui_gateway/test_resume_switched_provider_endpoint.py
            tests/tui_gateway/test_custom_provider_session_persistence.py
            tests/tui_gateway/test_session_resume_db_ownership.py
            tests/hermes_cli/test_pre_inference_route_host.py
            tests/hermes_cli/test_autorouter_picker_host.py
            tests/hermes_cli/test_resume_model_restore.py
            tests/gateway/test_session_mutation_model.py
            tests/gateway/test_session_local_route.py
            tests/gateway/test_api_server_turn_executor.py
            tests/gateway/test_background_command.py
            tests/tui_gateway/test_autorouter_turn_boundary.py
            tests/tui_gateway/test_autorouter_managed_roundtrip.py
            tests/gateway/test_autorouter_managed_state.py
            tests/tools/test_local_dev_process_ownership.py
            tests/gateway/test_autorouter_marker_validation.py
            tests/hermes_cli/test_autorouter_identity.py
            tests/tui_gateway/test_autorouter_turn_revalidation.py
          )
          HERMES_PYTHON="$PWD/.venv/bin/python" scripts/run_tests.sh -j 2 "${files[@]}" -q

  # NOTE ON THE AUTOROUTER PLUGIN SUITE: it does NOT run in this workflow. It
  # lives in the autorouter repository (diegorhoger/autorouter) on the
  # local/continuous-autorouting-140 branch and is macOS-oriented; this
  # repository's Linux CI cannot and must not fetch private cross-repo
  # sources. The AutoRouter-side validation status is reported separately in
  # the dispatch 141 report — it is not claimed here as a passing lane.

